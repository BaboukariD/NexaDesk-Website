<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Account — NexaDesk</title>
<link rel="stylesheet" href="/portal.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <a class="sidebar-logo" href="/client-dashboard.html"><img src="./nexadesk-logo.png" alt="NexaDesk"/></a>

    <a class="side-link" href="/client-dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Overview
    </a>
    <a class="side-link" href="/client-conversations.html">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Conversations
    </a>
    <a class="side-link" href="/client-analytics.html">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
      Analytics
    </a>
    <a class="side-link" href="/client-knowledge.html">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      AI Knowledge
    </a>
    <a class="side-link active" href="/client-account.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Account
    </a>

    <div class="sidebar-foot">
      <button class="logout-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <main class="main" style="max-width:calc(760px + var(--sidebar-w));">

    <div class="page-head">
      <h1 class="page-title">Account</h1>
      <p class="page-sub">Your plan details and login settings.</p>
    </div>

    <div class="loading-state" id="loading"><div class="spinner"></div>Loading…</div>

    <div id="accountApp" style="display:none;">

      <div class="section">
        <div class="section-head"><div class="section-title">Plan &amp; account</div></div>
        <div class="section-body" id="planInfo"></div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">Change password</div></div>
        <div class="section-body">
          <div class="field">
            <label for="newPassword">New password</label>
            <div class="field-row">
              <input type="password" id="newPassword" class="input" placeholder="At least 6 characters" autocomplete="new-password" style="padding-right:44px;"/>
              <span class="eye" id="eye1" role="button" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="field-row">
              <input type="password" id="confirmPassword" class="input" placeholder="Repeat new password" autocomplete="new-password" style="padding-right:44px;"/>
              <span class="eye" id="eye2" role="button" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
            </div>
          </div>
          <button class="btn btn-primary" id="changePasswordBtn">Update password</button>
          <div class="status-msg" id="passwordStatus"></div>
        </div>
      </div>

      <div class="section" id="upgradePanel" style="display:none;">
        <div class="section-head"><div class="section-title">Upgrade your plan</div></div>
        <div class="section-body">
          <p class="page-sub" style="margin-bottom:16px;">Unlock lead capture, analytics and the AI knowledge base.</p>
          <a class="btn btn-primary btn-lg" href="/contact.html?plan=growth">Upgrade to Growth — £99/mo</a>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function setStatus(id, text, type=''){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status-msg ' + type;
}

function escapeHtml(value){
  return String(value)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

document.getElementById('eye1').onclick = () => { const i = document.getElementById('newPassword'); i.type = i.type === 'password' ? 'text' : 'password'; };
document.getElementById('eye2').onclick = () => { const i = document.getElementById('confirmPassword'); i.type = i.type === 'password' ? 'text' : 'password'; };

async function load(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = '/client-login.html'; return; }

  const user = session.user;

  let client = null;
  const { data: cu } = await sb.from('ClientUsers').select('client_id').eq('auth_user_id', user.id).maybeSingle();
  if(cu?.client_id){
    const { data: cl } = await sb.from('Clients').select('*').eq('id', cu.client_id).maybeSingle();
    client = cl;
  }
  if(!client){
    const { data: cl } = await sb.from('Clients').select('*').eq('contact_email', user.email).maybeSingle();
    client = cl;
  }

  if(!client){ document.getElementById('loading').textContent = 'Client not found.'; return; }

  const plan = client.plan || 'starter';
  const planLabels = { starter: 'Starter — £49/mo', growth: 'Growth — £99/mo', pro: 'Pro — £199/mo' };

  document.getElementById('planInfo').innerHTML = `
    <div class="info-row">
      <span class="info-label">Business</span>
      <span class="info-value">${escapeHtml(client.business_name || '—')}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Email</span>
      <span class="info-value">${escapeHtml(user.email)}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Plan</span>
      <span class="badge ${plan}">${planLabels[plan] || plan}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Status</span>
      <span class="badge active"><span class="badge-dot"></span>Active</span>
    </div>
  `;

  if(plan === 'starter') document.getElementById('upgradePanel').style.display = 'block';

  document.getElementById('loading').style.display = 'none';
  document.getElementById('accountApp').style.display = 'block';
}

document.getElementById('changePasswordBtn').onclick = async () => {
  const newPw = document.getElementById('newPassword').value.trim();
  const confirm = document.getElementById('confirmPassword').value.trim();

  if(!newPw || !confirm){ setStatus('passwordStatus', 'Fill in both fields.', 'error'); return; }
  if(newPw.length < 6){ setStatus('passwordStatus', 'Password must be at least 6 characters.', 'error'); return; }
  if(newPw !== confirm){ setStatus('passwordStatus', 'Passwords don\u2019t match.', 'error'); return; }

  const btn = document.getElementById('changePasswordBtn');
  btn.disabled = true;
  setStatus('passwordStatus', 'Updating…');

  const { error } = await sb.auth.updateUser({ password: newPw });
  btn.disabled = false;

  if(error){ setStatus('passwordStatus', error.message, 'error'); return; }

  setStatus('passwordStatus', 'Password updated.', 'success');
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
};

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.href = '/client-login.html';
};
load();
</script>
</body>
</html>
