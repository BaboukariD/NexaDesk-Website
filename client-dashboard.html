<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

// ======================
// LOAD DASHBOARD
// ======================

async function loadDashboard(){

const loading =
document.getElementById('loading');

const app =
document.getElementById('app');

try{

// ----------------------
// GET SESSION
// ----------------------

const {
data:{ session },
error:sessionError
} = await supabase.auth.getSession();

if(sessionError){

console.error(sessionError);

window.location.href =
'/client-login.html';

return;

}

if(!session){

window.location.href =
'/client-login.html';

return;

}

// ----------------------
// USER INFO
// ----------------------

const user =
session.user;

document.getElementById(
'userEmail'
).textContent =
user.email;

// ----------------------
// LOAD CLIENT
// ----------------------

const {
data:client,
error:clientError
} = await supabase
.from('Clients')
.select('*')
.eq(
'contact_email',
user.email
)
.single();

if(clientError){

console.error(clientError);

document.getElementById(
'businessName'
).textContent =
'Client account';

}else{

document.getElementById(
'businessName'
).textContent =
client.business_name || 'Client';

}

// ----------------------
// LOAD LEADS
// ----------------------

const {
data:leads,
error:leadError
} = await supabase
.from('Leads')
.select('*')
.order(
'created_at',
{ ascending:false }
);

if(leadError){

console.error(leadError);

}

// lead count
document.getElementById(
'leadCount'
).textContent =
leads
? leads.length
: 0;

// convo count
document.getElementById(
'conversationCount'
).textContent =
leads
? leads.length
: 0;

// ----------------------
// TABLE
// ----------------------

const table =
document.getElementById(
'leadsTable'
);

table.innerHTML = '';

if(!leads || leads.length === 0){

document.getElementById(
'emptyState'
).style.display =
'block';

}else{

for(const lead of leads){

table.innerHTML += `

<tr>

<td>
${lead.name || '-'}
</td>

<td>
${lead.email || '-'}
</td>

<td>
${lead.phone || '-'}
</td>

<td>
${lead.preferred_contact || '-'}
</td>

</tr>

`;

}

}

// ----------------------
// SHOW APP
// ----------------------

loading.style.display =
'none';

app.style.display =
'flex';

}catch(err){

console.error(err);

window.location.href =
'/client-login.html';

}

}

// ======================
// LOGOUT
// ======================

document.getElementById(
'logoutBtn'
).onclick = async ()=>{

await supabase.auth.signOut();

window.location.href =
'/client-login.html';

};

// ======================
// START
// ======================

loadDashboard();

</script>
