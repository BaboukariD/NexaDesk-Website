<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
padding:40px;
}

.loading{
font-size:24px;
color:#9ca3af;
}

.app{
display:none;
flex-direction:column;
gap:24px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:800;
background:linear-gradient(
135deg,
#fff,
#8b5cf6
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.logout-btn{
padding:12px 18px;
border:none;
border-radius:12px;
background:#8b5cf6;
color:white;
font-weight:600;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0d1117;
border:1px solid rgba(255,255,255,.06);
padding:24px;
border-radius:20px;
}

.card-title{
font-size:14px;
color:#6b7280;
margin-bottom:12px;
}

.big{
font-size:38px;
font-weight:800;
}

.table-wrap{
margin-top:20px;
background:#0d1117;
border-radius:20px;
overflow:hidden;
border:1px solid rgba(255,255,255,.06);
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:18px;
text-align:left;
border-bottom:1px solid rgba(255,255,255,.05);
}

th{
color:#9ca3af;
font-size:14px;
}

td{
font-size:14px;
}

.empty{
padding:30px;
text-align:center;
color:#6b7280;
display:none;
}

</style>

</head>

<body>

<div
class="loading"
id="loading"
>
Loading dashboard...
</div>

<div
class="app"
id="app"
>

<div class="topbar">

<div>

<div class="logo">
NexaDesk
</div>

<div
style="
margin-top:8px;
color:#9ca3af;
"
id="businessName"
>
Loading...
</div>

</div>

<button
class="logout-btn"
id="logoutBtn"
>
Logout
</button>

</div>

<div class="grid">

<div class="card">

<div class="card-title">
Total Leads
</div>

<div
class="big"
id="leadCount"
>
0
</div>

</div>

<div class="card">

<div class="card-title">
Conversations
</div>

<div
class="big"
id="conversationCount"
>
0
</div>

</div>

<div class="card">

<div class="card-title">
Logged in as
</div>

<div
style="
font-size:16px;
font-weight:600;
margin-top:10px;
"
id="userEmail"
>
-
</div>

</div>

</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Contact Method</th>

</tr>

</thead>

<tbody id="leadsTable">

</tbody>

</table>

<div
class="empty"
id="emptyState"
>
No leads yet.
</div>

</div>

</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function loadDashboard(){

try{

const {
data:{ session }
} = await supabase.auth.getSession();

if(!session){

window.location.href =
'/client-login.html';

return;

}

const user =
session.user;

document.getElementById(
'userEmail'
).textContent =
user.email;

// LOAD CLIENT
const {
data:client
} = await supabase
.from('Clients')
.select('*')
.eq(
'contact_email',
user.email
)
.maybeSingle();

if(client){
    console.log(client);

document.getElementById(
'businessName'
).textContent =
client.business_name;

}

// LOAD LEADS
const {
data:leads
} = await supabase
.from('Leads')
.select('*')
.eq(
'client_id',
client.id
)
.order(
'created_at',
{ ascending:false }
);

document.getElementById(
'leadCount'
).textContent =
leads
? leads.length
: 0;

document.getElementById(
'conversationCount'
).textContent =
leads
? leads.length
: 0;

const table =
document.getElementById(
'leadsTable'
);

if(leads && leads.length){

for(const lead of leads){

table.innerHTML += `

<tr>

<td>${lead.name || '-'}</td>

<td>${lead.email || '-'}</td>

<td>${lead.phone || '-'}</td>

<td>${lead.preferred_contact || '-'}</td>

</tr>

`;

}

}else{

document.getElementById(
'emptyState'
).style.display =
'block';

}

document.getElementById(
'loading'
).style.display =
'none';

document.getElementById(
'app'
).style.display =
'flex';

}catch(err){

console.error(err);

alert(err.message);

}

}

// LOGOUT
document.getElementById(
'logoutBtn'
).onclick = async ()=>{

await supabase.auth.signOut();

window.location.href =
'/client-login.html';

};

loadDashboard();

</script>

</body>
</html>
