<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Client Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
display:flex;
}

.sidebar{
width:260px;
background:#0b1120;
border-right:1px solid rgba(255,255,255,.06);
padding:30px 20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:28px;
font-weight:800;
margin-bottom:40px;
background:linear-gradient(135deg,#fff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav{
display:flex;
flex-direction:column;
gap:12px;
}

.nav button{
background:#111827;
border:none;
color:#d1d5db;
padding:14px;
border-radius:14px;
cursor:pointer;
font-size:15px;
font-weight:600;
text-align:left;
transition:.2s;
}

.nav button:hover{
background:#1f2937;
color:white;
}

.nav button.active{
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
}

.logout{
margin-top:auto;
background:#dc2626 !important;
color:white !important;
}

.main{
flex:1;
padding:40px;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:32px;
}

.title{
font-size:32px;
font-weight:800;
}

.subtitle{
color:#9ca3af;
margin-top:6px;
}

.user-box{
background:#111827;
padding:14px 18px;
border-radius:14px;
color:#d1d5db;
font-size:14px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:32px;
}

.card{
background:#0f172a;
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:24px;
}

.card-label{
color:#9ca3af;
font-size:14px;
margin-bottom:10px;
}

.card-value{
font-size:34px;
font-weight:800;
}

.section{
background:#0f172a;
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:24px;
}

.section h2{
margin-bottom:20px;
font-size:22px;
}

.table{
width:100%;
border-collapse:collapse;
}

.table th{
text-align:left;
padding-bottom:14px;
color:#9ca3af;
font-size:14px;
font-weight:600;
}

.table td{
padding:16px 0;
border-top:1px solid rgba(255,255,255,.05);
font-size:14px;
color:#e5e7eb;
}

.loading{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
font-size:18px;
color:#9ca3af;
}

.empty{
color:#6b7280;
padding:20px 0;
}

</style>

</head>

<body>

<div
id="loading"
class="loading"
>
Loading dashboard...
</div>

<div
id="app"
style="display:none;width:100%;"
>

<div class="sidebar">

<div class="logo">
NexaDesk
</div>

<div class="nav">

<button class="active">
Overview
</button>

<button>
Conversations
</button>

<button>
Knowledge Base
</button>

<button>
AI Settings
</button>

<button
id="logoutBtn"
class="logout"
>
Logout
</button>

</div>

</div>

<div class="main">

<div class="topbar">

<div>

<div class="title">
Client Dashboard
</div>

<div
class="subtitle"
id="businessName"
>
Loading business...
</div>

</div>

<div
class="user-box"
id="userEmail"
>
Loading...
</div>

</div>

<div class="cards">

<div class="card">
<div class="card-label">
Total Leads
</div>
<div
class="card-value"
id="leadCount"
>
0
</div>
</div>

<div class="card">
<div class="card-label">
Conversations
</div>
<div
class="card-value"
id="conversationCount"
>
0
</div>
</div>

</div>

<div class="section">

<h2>
Recent Leads
</h2>

<table class="table">

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Preferred</th>
</tr>
</thead>

<tbody
id="leadsTable"
>
</tbody>

</table>

<div
class="empty"
id="emptyState"
style="display:none;"
>
No leads yet.
</div>

</div>

</div>

</div>

<script>

// ======================
// SUPABASE
// ======================

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'YOUR_ANON_KEY';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

// ======================
// INIT
// ======================

init();

async function init(){

// CHECK AUTH
const {
data: { user }
} = await supabase.auth.getUser();

if(!user){

window.location.href =
'/client-login.html';

return;

}

// SHOW USER EMAIL
document.getElementById(
'userEmail'
).textContent =
user.email;

// FIND CLIENT USER
const {
data: clientUser,
error: clientUserError
} = await supabase
.from('ClientUsers')
.select('*')
.eq('email', user.email)
.single();

if(
clientUserError ||
!clientUser
){

alert(
'No linked client account found.'
);

await supabase.auth.signOut();

window.location.href =
'/client-login.html';

return;

}

const clientId =
clientUser.client_id;

// GET CLIENT INFO
const {
data: client
} = await supabase
.from('Clients')
.select('*')
.eq('id', clientId)
.single();

document.getElementById(
'businessName'
).textContent =
client.business_name;

// GET LEADS
const {
data: leads
} = await supabase
.from('Leads')
.select('*')
.eq('client_id', clientId)
.order('created_at', {
ascending:false
});

// LEAD COUNT
document.getElementById(
'leadCount'
).textContent =
leads?.length || 0;

// TABLE
const table =
document.getElementById(
'leadsTable'
);

if(!leads || leads.length === 0){

document.getElementById(
'emptyState'
).style.display =
'block';

} else {

leads.forEach((lead) => {

const row =
document.createElement('tr');

row.innerHTML = `
<td>${lead.name || '-'}</td>
<td>${lead.email || '-'}</td>
<td>${lead.phone || '-'}</td>
<td>${lead.preferred_contact || '-'}</td>
`;

table.appendChild(row);

});

}

// CONVERSATIONS COUNT
const {
data: conversations
} = await supabase
.from('Conversations')
.select('*')
.eq('client_id', clientId);

document.getElementById(
'conversationCount'
).textContent =
conversations?.length || 0;

// SHOW APP
document.getElementById(
'loading'
).style.display =
'none';

document.getElementById(
'app'
).style.display =
'flex';

}

// ======================
// LOGOUT
// ======================

document.getElementById(
'logoutBtn'
).onclick = async () => {

await supabase.auth.signOut();

window.location.href =
'/client-login.html';

};

</script>

</body>

</html>
