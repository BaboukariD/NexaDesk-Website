<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Leads</title>

<style>

body {
font-family: Inter, sans-serif;
background: #f6f7fb;
padding: 40px;
}

h1 {
margin-bottom: 24px;
}

table {
width: 100%;
border-collapse: collapse;
background: white;
border-radius: 14px;
overflow: hidden;
box-shadow:
0 10px 30px rgba(0,0,0,0.05);
}

th, td {
padding: 16px;
text-align: left;
border-bottom: 1px solid #eee;
}

th {
background: #fafafe;
font-weight: 600;
}

tr:hover {
background: #fafafa;
}

</style>

</head>

<body>

<h1>Captured Leads</h1>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Preferred Contact</th>
<th>Message</th>
</tr>
</thead>

<tbody id="lead-table">

</tbody>

</table>

<script>

async function loadLeads() {

const response = await fetch(
'https://nexadesk.co.uk/api/get-leads'
);

const leads = await response.json();

const table =
document.getElementById('lead-table');

table.innerHTML = '';

for (const lead of leads) {

table.innerHTML += `
<tr>
<td>${lead.name}</td>
<td>${lead.email}</td>
<td>${lead.preferred_contact}</td>
<td>${lead.message}</td>
</tr>
`;

}

}

loadLeads();

</script>

</body>
</html>
