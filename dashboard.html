<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaDesk Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#0b1020;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:240px;
background:#121933;
padding:30px 20px;
border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:1.4rem;
font-weight:700;
margin-bottom:40px;
background:linear-gradient(90deg,#7c5cff,#5ce1e6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-item{
padding:14px 16px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:0.2s;
color:#cfd6ff;
}

.nav-item:hover{
background:#1a2345;
}

.main{
flex:1;
padding:40px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.topbar h1{
font-size:2rem;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.card{
background:#151d3b;
padding:24px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.06);
}

.card h2{
font-size:2rem;
margin-top:10px;
}

.card p{
color:#9da8d6;
}

.table-wrap{
background:#151d3b;
padding:24px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.06);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:16px;
text-align:left;
border-bottom:1px solid rgba(255,255,255,0.06);
}

th{
color:#9da8d6;
font-weight:500;
}

td{
color:white;
}

.status{
background:#1e2a56;
padding:6px 12px;
border-radius:999px;
display:inline-block;
font-size:0.85rem;
}

</style>
</head>
<body style="visibility:hidden">

<script>
  const password = prompt("Enter password to access dashboard:");
  sessionStorage.setItem('nd_auth', password);
</script>

<div class="sidebar">

<div class="logo">NexaDesk</div>

<div class="nav-item">Dashboard</div>
<div class="nav-item">Leads</div>
<div class="nav-item">Conversations</div>
<div class="nav-item">Analytics</div>
<div class="nav-item">Settings</div>

</div>

<div class="main">

<div class="topbar">
<h1>Dashboard</h1>
</div>

<div class="cards">

<div class="card">
<p>Total Leads</p>
<h2 id="statLeads">—</h2>
</div>

<div class="card">
<p>New Today</p>
<h2 id="statToday">—</h2>
</div>

<div class="card">
<p>This Week</p>
<h2 id="statWeek">—</h2>
</div>

<div class="card">
<p>Active Clients</p>
<h2 id="statClients">—</h2>
</div>

</div>

<div class="table-wrap">

<h2>Recent Leads</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Business</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody id="leadsTable">
</tbody>

</table>

</div>

</div>

<script src="dashboard.js"></script>
</body>
</html>
