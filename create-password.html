<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Password — NexaDesk</title>
<link rel="stylesheet" href="/portal.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">

<div class="auth-card">
  <a class="auth-logo" href="/"><img src="./nexadesk-logo.png" alt="NexaDesk"/></a>

  <div class="auth-title">Create your password</div>
  <div class="auth-desc">You're almost in. Set a secure password for your NexaDesk client portal.</div>

  <div class="field">
    <label for="password">Password</label>
    <div class="field-row">
      <input type="password" id="password" class="input" placeholder="At least 6 characters" autocomplete="new-password" style="padding-right:44px;"/>
      <span class="eye" id="eye1" role="button" aria-label="Show password">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </div>
  </div>

  <div class="field">
    <label for="confirmPassword">Confirm password</label>
    <div class="field-row">
      <input type="password" id="confirmPassword" class="input" placeholder="Repeat your password" autocomplete="new-password" style="padding-right:44px;"/>
      <span class="eye" id="eye2" role="button" aria-label="Show password">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </div>
  </div>

  <button class="btn btn-primary btn-block btn-lg" id="saveBtn">Set password & open dashboard</button>
  <div class="status-msg" id="msg" style="text-align:center;"></div>
</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msg = document.getElementById('msg');
const saveBtn = document.getElementById('saveBtn');

function setMsg(text, type=''){ msg.textContent = text; msg.className = 'status-msg ' + type; msg.style.textAlign='center'; }

document.getElementById('eye1').onclick = () => { const i = document.getElementById('password'); i.type = i.type === 'password' ? 'text' : 'password'; };
document.getElementById('eye2').onclick = () => { const i = document.getElementById('confirmPassword'); i.type = i.type === 'password' ? 'text' : 'password'; };

saveBtn.onclick = async () => {
  const password = document.getElementById('password').value.trim();
  const confirm  = document.getElementById('confirmPassword').value.trim();

  if(!password || !confirm){ setMsg('Fill in both fields.', 'error'); return; }
  if(password.length < 6){ setMsg('Password must be at least 6 characters.', 'error'); return; }
  if(password !== confirm){ setMsg('Passwords don\u2019t match.', 'error'); return; }

  saveBtn.disabled = true;
  setMsg('Setting up your account\u2026');

  const { data: { user }, error: userErr } = await sb.auth.getUser();
  if(!user || userErr){
    setMsg('Session expired. Request a new activation link from the login page.', 'error');
    saveBtn.disabled = false;
    return;
  }

  const { error: updateErr } = await sb.auth.updateUser({ password });
  if(updateErr){ setMsg(updateErr.message, 'error'); saveBtn.disabled = false; return; }

  // Link auth user to client record if not already linked
  const { data: existing } = await sb.from('ClientUsers').select('id').eq('auth_user_id', user.id).maybeSingle();
  if(!existing){
    const { data: client } = await sb.from('Clients').select('id').eq('contact_email', user.email).maybeSingle();
    if(client){
      await sb.from('ClientUsers').insert({ auth_user_id: user.id, client_id: client.id, email: user.email });
    }
  }

  setMsg('Password set. Opening your dashboard\u2026', 'success');
  setTimeout(() => { window.location.href = '/client-dashboard.html'; }, 1000);
};
</script>
</body>
</html>
