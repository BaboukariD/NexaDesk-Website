<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Create Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.card{
width:460px;
background:#070b18;
border-radius:30px;
padding:40px;
border:1px solid rgba(255,255,255,.06);
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
color:#9ca3af;
margin-bottom:30px;
}

.password-wrap{
position:relative;
margin-bottom:18px;
}

.input{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#0f172a;
color:white;
font-size:18px;
outline:none;
}

.eye{
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
color:#9ca3af;
}

.btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
font-size:20px;
font-weight:800;
cursor:pointer;
margin-top:12px;
}

.msg{
margin-top:18px;
color:#9ca3af;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>
Create Password
</h1>

<p>
Secure your client dashboard.
</p>

<div class="password-wrap">

<input
type="password"
id="password"
class="input"
placeholder="Create password"
/>

<div
class="eye"
id="toggle1"
>
👁
</div>

</div>

<div class="password-wrap">

<input
type="password"
id="confirmPassword"
class="input"
placeholder="Confirm password"
/>

<div
class="eye"
id="toggle2"
>
👁
</div>

</div>

<button
class="btn"
id="saveBtn"
>
Save Password
</button>

<div
class="msg"
id="msg"
></div>

</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

// SHOW/HIDE PASSWORD
function setupToggle(
toggleId,
inputId
){

document.getElementById(toggleId)
.onclick = () => {

const input =
document.getElementById(inputId);

input.type =
input.type === 'password'
? 'text'
: 'password';

};

}

setupToggle('toggle1','password');
setupToggle('toggle2','confirmPassword');

// SAVE PASSWORD
document.getElementById(
'saveBtn'
).onclick = async () => {

const password =
document.getElementById('password')
.value
.trim();

const confirmPassword =
document.getElementById('confirmPassword')
.value
.trim();

const msg =
document.getElementById('msg');

if(
!password ||
!confirmPassword
){

msg.textContent =
'Please fill all fields';

return;

}

if(password !== confirmPassword){

msg.textContent =
'Passwords do not match';

return;

}

// GET USER
const {
data: { user }
} = await supabase.auth.getUser();

if(!user){

msg.textContent =
'Session expired.';

return;

}

// SAVE PASSWORD
const {
error
} = await supabase.auth.updateUser({

password

});

if(error){

msg.textContent =
error.message;

return;

}

// FIND CLIENT
const {
data: client
} = await supabase
.from('Clients')
.select('*')
.eq('contact_email', user.email)
.single();

// CREATE CLIENT USER
await supabase
.from('ClientUsers')
.insert({

email:user.email,
client_id:client.id,
auth_user_id:user.id

});

// REDIRECT
window.location.href =
'/client-dashboard.html';

};

</script>

</body>

</html>
