<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Password — NexaDesk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

body {
  background: #050816;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  padding: 20px;
}

.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #7c3aed22, transparent 50%),
    radial-gradient(circle at 80% 80%, #8b5cf622, transparent 50%);
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 460px;
  background: #070b18;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 30px;
  padding: 44px 40px;
  position: relative;
  z-index: 2;
  box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

.logo {
  width: 160px;
  margin-bottom: 28px;
  object-fit: contain;
}

.title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
}

.desc {
  color: #6b7280;
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.field {
  position: relative;
  margin-bottom: 16px;
}

.input {
  width: 100%;
  padding: 18px 52px 18px 18px;
  background: #0f172a;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 16px;
  color: white;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}

.input:focus {
  border-color: #8b5cf6;
}

.input::placeholder {
  color: #4b5563;
}

.eye {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 18px;
  color: #6b7280;
  user-select: none;
  transition: color .2s;
}

.eye:hover { color: white; }

.btn {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all .2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(139,92,246,.4);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.msg {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  min-height: 22px;
  color: #6b7280;
}

.msg.error   { color: #f87171; }
.msg.success { color: #34d399; }

</style>
</head>
<body>

<div class="bg"></div>

<div class="card">

  <img src="./nexadesk-logo.png" alt="NexaDesk" class="logo" />

  <div class="title">Create your password</div>
  <div class="desc">You're almost in. Set a secure password for your NexaDesk client portal.</div>

  <div class="field">
    <input type="password" id="password" class="input" placeholder="Create password" />
    <span class="eye" id="eye1">👁</span>
  </div>

  <div class="field">
    <input type="password" id="confirmPassword" class="input" placeholder="Confirm password" />
    <span class="eye" id="eye2">👁</span>
  </div>

  <button class="btn" id="saveBtn">Set Password & Enter Dashboard</button>

  <div class="msg" id="msg"></div>

</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msg     = document.getElementById('msg');
const saveBtn = document.getElementById('saveBtn');

function setMsg(text, type = '') {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

// Eye toggles
document.getElementById('eye1').onclick = () => {
  const i = document.getElementById('password');
  i.type = i.type === 'password' ? 'text' : 'password';
};
document.getElementById('eye2').onclick = () => {
  const i = document.getElementById('confirmPassword');
  i.type = i.type === 'password' ? 'text' : 'password';
};

saveBtn.onclick = async () => {
  const password = document.getElementById('password').value.trim();
  const confirm  = document.getElementById('confirmPassword').value.trim();

  if (!password || !confirm) {
    setMsg('Please fill in both fields.', 'error');
    return;
  }

  if (password.length < 6) {
    setMsg('Password must be at least 6 characters.', 'error');
    return;
  }

  if (password !== confirm) {
    setMsg('Passwords do not match.', 'error');
    return;
  }

  saveBtn.disabled = true;
  setMsg('Setting up your account...');

  // Get current session (from magic link)
  const { data: { user }, error: userErr } = await sb.auth.getUser();

  if (!user || userErr) {
    setMsg('Session expired. Please request a new activation link.', 'error');
    saveBtn.disabled = false;
    return;
  }

  // Update password
  const { error: updateErr } = await sb.auth.updateUser({ password });

  if (updateErr) {
    setMsg(updateErr.message, 'error');
    saveBtn.disabled = false;
    return;
  }

  // Link user to their client in ClientUsers (if not already linked)
  const { data: existing } = await sb
    .from('ClientUsers')
    .select('id')
    .eq('auth_user_id', user.id)
    .maybeSingle();

  if (!existing) {
    // Find their client record
    const { data: client } = await sb
      .from('Clients')
      .select('id')
      .eq('contact_email', user.email)
      .maybeSingle();

    if (client) {
      await sb.from('ClientUsers').insert({
        auth_user_id: user.id,
        client_id:    client.id,
        email:        user.email
      });
    }
  }

  setMsg('Password set! Taking you to your dashboard...', 'success');
  setTimeout(() => { window.location.href = '/client-dashboard.html'; }, 1400);
};
</script>

</body>
</html>
