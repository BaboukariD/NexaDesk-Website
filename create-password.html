<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Create Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:white;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#7c3aed22,transparent 40%),
radial-gradient(circle at bottom,#8b5cf622,transparent 40%);
}

.card{
width:460px;
background:#070b18;
border-radius:30px;
padding:40px;
border:1px solid rgba(255,255,255,.06);
position:relative;
z-index:2;
}

.title{
font-size:44px;
font-weight:800;
margin-bottom:10px;
}

.desc{
color:#9ca3af;
margin-bottom:30px;
line-height:1.7;
}

.password-wrap{
position:relative;
margin-bottom:18px;
}

.input{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#0f172a;
color:white;
font-size:18px;
outline:none;
border:1px solid transparent;
}

.input:focus{
border-color:#8b5cf6;
}

.eye{
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
color:#9ca3af;
user-select:none;
}

.btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
font-size:20px;
font-weight:800;
cursor:pointer;
margin-top:12px;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.msg{
margin-top:18px;
text-align:center;
line-height:1.6;
min-height:24px;
color:#9ca3af;
}

.msg.error{
color:#f87171;
}

.msg.success{
color:#34d399;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="title">
Create Password
</div>

<div class="desc">
Secure your client dashboard with a password.
</div>

<div class="password-wrap">

<input
type="password"
id="password"
class="input"
placeholder="Create password"
/>

<div
class="eye"
id="toggle1"
>
👁
</div>

</div>

<div class="password-wrap">

<input
type="password"
id="confirmPassword"
class="input"
placeholder="Confirm password"
/>

<div
class="eye"
id="toggle2"
>
👁
</div>

</div>

<button
class="btn"
id="saveBtn"
>
Save Password
</button>

<div
class="msg"
id="msg"
></div>

</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

function setupToggle(toggleId,inputId){

document.getElementById(toggleId)
.onclick = ()=>{

const input =
document.getElementById(inputId);

input.type =
input.type === 'password'
? 'text'
: 'password';

};

}

setupToggle('toggle1','password');
setupToggle('toggle2','confirmPassword');

const msg =
document.getElementById('msg');

function setMsg(text,type=''){

msg.textContent = text;
msg.className = 'msg ' + type;

}

document.getElementById('saveBtn')
.onclick = async ()=>{

const password =
document.getElementById('password')
.value
.trim();

const confirmPassword =
document.getElementById('confirmPassword')
.value
.trim();

if(!password || !confirmPassword){

setMsg(
'Please fill all fields.',
'error'
);

return;

}

if(password.length < 6){

setMsg(
'Password must be at least 6 characters.',
'error'
);

return;

}

if(password !== confirmPassword){

setMsg(
'Passwords do not match.',
'error'
);

return;

}

const {
data:{ user }
} = await sb.auth.getUser();

if(!user){

setMsg(
'Activation session expired.',
'error'
);

return;

}

const {
error:updateError
} = await sb.auth.updateUser({

password

});

if(updateError){

setMsg(
updateError.message,
'error'
);

return;

}

setMsg(
'Password created successfully.',
'success'
);

setTimeout(()=>{

window.location.href =
'/client-dashboard.html';

},1200);

};

</script>

</body>

</html>
