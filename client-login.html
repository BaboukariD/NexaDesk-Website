<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Client Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow-y:auto;
padding:40px 20px;
color:white;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, #7c3aed22, transparent 50%),
radial-gradient(circle at 80% 80%, #8b5cf622, transparent 50%);
pointer-events:none;
}

.card{
width:100%;
max-width:460px;
background:#070b18;
border:1px solid rgba(255,255,255,.06);
border-radius:30px;
padding:40px;
position:relative;
z-index:2;
box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
font-size:62px;
font-weight:800;
margin-bottom:18px;
background:linear-gradient(135deg,#fff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
color:#9ca3af;
font-size:18px;
margin-bottom:34px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:26px;
background:#0f172a;
padding:6px;
border-radius:20px;
}

.tab{
flex:1;
padding:16px;
border:none;
border-radius:16px;
background:transparent;
color:#94a3b8;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.tab:hover{
color:white;
}

.tab.active{
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
box-shadow:0 0 25px rgba(139,92,246,.35);
}

.form-title{
font-size:28px;
font-weight:800;
margin-bottom:8px;
}

.form-desc{
color:#6b7280;
font-size:15px;
line-height:1.6;
margin-bottom:24px;
}

.input{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#0f172a;
margin-bottom:18px;
color:white;
font-size:17px;
outline:none;
border:1px solid transparent;
}

.input:focus{
border-color:#8b5cf6;
}

.input::placeholder{
color:#4b5563;
}

.btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
font-size:18px;
font-weight:800;
cursor:pointer;
margin-top:10px;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 30px rgba(139,92,246,.35);
}

.msg{
margin-top:18px;
line-height:1.6;
font-size:14px;
text-align:center;
min-height:24px;
color:#9ca3af;
}

.msg.error{
color:#f87171;
}

.msg.success{
color:#34d399;
}

.success-box{
display:none;
text-align:center;
padding:20px 0;
}

.success-box .icon{
font-size:60px;
margin-bottom:18px;
}

.success-box h3{
font-size:28px;
margin-bottom:10px;
}

.success-box p{
color:#6b7280;
line-height:1.7;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="logo">
NexaDesk
</div>

<div class="sub">
Secure client portal access
</div>

<div id="mainForm">

<div class="tabs">

<button
class="tab active"
id="loginTab"
type="button"
>
Login
</button>

<button
class="tab"
id="activateTab"
type="button"
>
Activate Account
</button>

</div>

<div
class="form-title"
id="formTitle"
>
Welcome back
</div>

<div
class="form-desc"
id="formDesc"
>
Login to access your dashboard and leads.
</div>

<input
type="email"
id="email"
class="input"
placeholder="Business email"
/>

<input
type="password"
id="password"
class="input"
placeholder="Password"
/>

<button
class="btn"
id="submitBtn"
type="button"
>
Login
</button>

<div
class="msg"
id="msg"
></div>

</div>

<div
class="success-box"
id="successBox"
>

<div class="icon">
📧
</div>

<h3>
Check your email
</h3>

<p>
We've sent you an activation link.<br>
Open your email to create your password.
</p>

</div>

</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const { createClient } =
supabase;

const sb =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const loginTab =
document.getElementById('loginTab');

const activateTab =
document.getElementById('activateTab');

const formTitle =
document.getElementById('formTitle');

const formDesc =
document.getElementById('formDesc');

const passwordInput =
document.getElementById('password');

const submitBtn =
document.getElementById('submitBtn');

const msg =
document.getElementById('msg');

const mainForm =
document.getElementById('mainForm');

const successBox =
document.getElementById('successBox');

let mode = 'login';

function setMsg(text,type=''){

msg.textContent = text;
msg.className = 'msg ' + type;

}

function switchMode(newMode){

mode = newMode;

loginTab.classList.remove('active');
activateTab.classList.remove('active');

setMsg('');

if(mode === 'login'){

loginTab.classList.add('active');

formTitle.textContent =
'Welcome back';

formDesc.textContent =
'Login to access your dashboard and leads.';

submitBtn.textContent =
'Login';

passwordInput.style.display =
'block';

}else{

activateTab.classList.add('active');

formTitle.textContent =
'Activate your account';

formDesc.textContent =
'Enter the email we already have on file and we’ll send you a secure activation link.';

submitBtn.textContent =
'Send Activation Link';

passwordInput.style.display =
'none';

}

}

loginTab.onclick = () =>
switchMode('login');

activateTab.onclick = () =>
switchMode('activate');

submitBtn.onclick = async () => {

const email =
document.getElementById('email')
.value
.trim();

const password =
passwordInput.value.trim();

if(!email){

setMsg(
'Please enter your email.',
'error'
);

return;

}

// ======================
// ACTIVATE ACCOUNT
// ======================

if(mode === 'activate'){

submitBtn.disabled = true;

const {
data:clients,
error:clientError
} = await sb
.from('Clients')
.select('id')
.eq(
'contact_email',
email
);

if(
clientError ||
!clients ||
clients.length === 0
){

setMsg(
'This email is not registered with NexaDesk.',
'error'
);

submitBtn.disabled = false;

return;

}

const {
error:otpError
} = await sb.auth.signInWithOtp({

email,

options:{
emailRedirectTo:
'https://nexadesk.co.uk/create-password.html'
}

});

if(otpError){

setMsg(
otpError.message,
'error'
);

submitBtn.disabled = false;

return;

}

mainForm.style.display =
'none';

successBox.style.display =
'block';

return;

}

// ======================
// LOGIN
// ======================

if(!password){

setMsg(
'Please enter your password.',
'error'
);

return;

}

submitBtn.disabled = true;

const {
error:loginError
} = await sb.auth.signInWithPassword({

email,
password

});

if(loginError){

setMsg(
loginError.message,
'error'
);

submitBtn.disabled = false;

return;

}

setMsg(
'Login successful.',
'success'
);

setTimeout(()=>{

window.location.href =
'/client-dashboard.html';

},1200);

};

</script>

</body>

</html>
