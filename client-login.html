<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Login — NexaDesk</title>
<link rel="stylesheet" href="/portal.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">

<div class="auth-card">
  <a class="auth-logo" href="/"><img src="./nexadesk-logo.png" alt="NexaDesk"/></a>

  <div id="mainForm">
    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">Log in</button>
      <button class="tab" id="activateTab" type="button">Activate account</button>
    </div>

    <div class="auth-title" id="formTitle">Welcome back</div>
    <div class="auth-desc" id="formDesc">Log in to view your leads and conversations.</div>

    <div class="field">
      <label for="email">Business email</label>
      <input type="email" id="email" class="input" placeholder="you@business.com" autocomplete="email"/>
    </div>

    <div class="field" id="passwordField">
      <label for="password">Password</label>
      <input type="password" id="password" class="input" placeholder="Your password" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary btn-block btn-lg" id="submitBtn" type="button">Log in</button>
    <div class="status-msg" id="msg" style="text-align:center;"></div>
  </div>

  <div class="auth-success" id="successBox">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
    </div>
    <h3>Check your email</h3>
    <p>We've sent you an activation link.<br>Open it to create your password.</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginTab = document.getElementById('loginTab');
const activateTab = document.getElementById('activateTab');
const formTitle = document.getElementById('formTitle');
const formDesc = document.getElementById('formDesc');
const passwordField = document.getElementById('passwordField');
const passwordInput = document.getElementById('password');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');
const mainForm = document.getElementById('mainForm');
const successBox = document.getElementById('successBox');

let mode = 'login';

function setMsg(text, type=''){ msg.textContent = text; msg.className = 'status-msg ' + type; msg.style.textAlign='center'; }

function switchMode(newMode){
  mode = newMode;
  loginTab.classList.toggle('active', mode === 'login');
  activateTab.classList.toggle('active', mode !== 'login');
  setMsg('');
  if(mode === 'login'){
    formTitle.textContent = 'Welcome back';
    formDesc.textContent = 'Log in to view your leads and conversations.';
    submitBtn.textContent = 'Log in';
    passwordField.style.display = 'block';
  } else {
    formTitle.textContent = 'Activate your account';
    formDesc.textContent = 'Enter the email we have on file and we\u2019ll send you a secure activation link.';
    submitBtn.textContent = 'Send activation link';
    passwordField.style.display = 'none';
  }
}

loginTab.onclick = () => switchMode('login');
activateTab.onclick = () => switchMode('activate');

submitBtn.onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = passwordInput.value.trim();

  if(!email){ setMsg('Enter your email address.', 'error'); return; }

  // ===== ACTIVATE =====
  if(mode === 'activate'){
    submitBtn.disabled = true;

    let registered = false;
    try{
      const r = await fetch('/api/check-client', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const d = await r.json();
      registered = !!d.registered;
    }catch{}

    if(!registered){
      setMsg('This email isn\u2019t registered with NexaDesk.', 'error');
      submitBtn.disabled = false;
      return;
    }

    const { error: otpError } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: 'https://nexadesk.co.uk/create-password.html' }
    });

    if(otpError){ setMsg(otpError.message, 'error'); submitBtn.disabled = false; return; }

    mainForm.style.display = 'none';
    successBox.style.display = 'block';
    return;
  }

  // ===== LOGIN =====
  if(!password){ setMsg('Enter your password.', 'error'); return; }

  submitBtn.disabled = true;
  const { error: loginError } = await sb.auth.signInWithPassword({ email, password });

  if(loginError){ setMsg(loginError.message, 'error'); submitBtn.disabled = false; return; }

  setMsg('Logged in. Redirecting\u2026', 'success');
  setTimeout(() => { window.location.href = '/client-dashboard.html'; }, 800);
};

passwordInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitBtn.click(); });
document.getElementById('email').addEventListener('keydown', e => { if(e.key === 'Enter') submitBtn.click(); });
</script>
</body>
</html>
