<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NexaDesk Client Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter,sans-serif;
    }

    body{
      background:#050816;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:white;
    }

    .bg{
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at top,#7c3aed22,transparent 40%),
      radial-gradient(circle at bottom,#8b5cf622,transparent 40%);
      pointer-events:none;
    }

    .card{
      width:420px;
      background:rgba(10,12,25,.92);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:40px;
      position:relative;
      z-index:2;
      backdrop-filter:blur(12px);
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .logo{
      font-size:34px;
      font-weight:700;
      margin-bottom:12px;
      background:linear-gradient(135deg,#fff,#8b5cf6);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .sub{
      color:#9ca3af;
      line-height:1.5;
      margin-bottom:32px;
    }

    .tabs{
      display:flex;
      gap:12px;
      margin-bottom:24px;
    }

    .tab{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#111827;
      color:#d1d5db;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:
      background .2s ease,
      transform .15s ease,
      color .2s ease,
      box-shadow .2s ease;
    }

    .tab:hover{
      background:#1f2937;
      color:white;
      transform:translateY(-1px);
    }

    .tab.active{
      background:linear-gradient(
        135deg,
        #8b5cf6,
        #7c3aed
      );
      color:white;
      box-shadow:
      0 10px 30px rgba(139,92,246,.35);
    }

    .input{
      width:100%;
      padding:14px;
      margin-bottom:16px;
      border:none;
      border-radius:14px;
      background:#111827;
      color:white;
      outline:none;
      border:1px solid transparent;
      font-size:15px;
    }

    .input:focus{
      border-color:#8b5cf6;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(
        135deg,
        #8b5cf6,
        #7c3aed
      );
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .msg{
      margin-top:18px;
      color:#9ca3af;
      font-size:14px;
      text-align:center;
      line-height:1.5;
    }

  </style>

</head>

<body>

  <div class="bg"></div>

  <div class="card">

    <div class="logo">
      NexaDesk
    </div>

    <div class="sub">
      Secure client portal access
    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        type="button"
      >
        Login
      </button>

      <button
        class="tab"
        id="activateTab"
        type="button"
      >
        Activate Account
      </button>

    </div>

    <input
      type="email"
      id="email"
      class="input"
      placeholder="Business email"
    />

    <input
      type="password"
      id="password"
      class="input"
      placeholder="Password"
    />

    <button
      class="btn"
      id="submitBtn"
      type="button"
    >
      Login
    </button>

    <div
      class="msg"
      id="msg"
    ></div>

  </div>

  <script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
      'https://exqdmvloldvshzpxevht.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    // =========================
    // ELEMENTS
    // =========================

    const loginTab =
      document.getElementById('loginTab');

    const activateTab =
      document.getElementById('activateTab');

    const submitBtn =
      document.getElementById('submitBtn');

    const msg =
      document.getElementById('msg');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    let mode = 'login';

    // =========================
    // MODE SWITCHING
    // =========================

    function setMode(newMode){

      mode = newMode;

      loginTab.classList.remove('active');
      activateTab.classList.remove('active');

      if(mode === 'login'){

        loginTab.classList.add('active');

        submitBtn.textContent =
        'Login';

      } else {

        activateTab.classList.add('active');

        submitBtn.textContent =
        'Activate Account';

      }

      msg.textContent = '';

    }

    // =========================
    // TAB EVENTS
    // =========================

    loginTab.addEventListener(
      'click',
      () => {
        setMode('login');
      }
    );

    activateTab.addEventListener(
      'click',
      () => {
        setMode('activate');
      }
    );

    // =========================
    // AUTH BUTTON
    // =========================

    submitBtn.addEventListener(
      'click',
      async () => {

        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value.trim();

        if(!email || !password){

          msg.textContent =
          'Please fill in all fields';

          return;

        }

        msg.textContent =
        'Please wait...';

        // =====================
        // ACTIVATE ACCOUNT
        // =====================

        if(mode === 'activate'){

          const {
            data: clients,
            error: clientError
          } = await supabase
          .from('Clients')
          .select('*')
          .eq('contact_email', email);

          if(
            clientError ||
            !clients ||
            clients.length === 0
          ){

            msg.textContent =
            'This email is not registered as a NexaDesk client.';

            return;

          }

          const client =
          clients[0];

          const {
            data,
            error
          } = await supabase.auth.signUp({

            email,
            password

          });

          if(error){

            msg.textContent =
            error.message;

            return;

          }

          const {
            error: linkError
          } = await supabase
          .from('ClientUsers')
          .insert({

            auth_user_id:
            data.user.id,

            client_id:
            client.id,

            email

          });

          if(linkError){

            msg.textContent =
            linkError.message;

            return;

          }

          msg.textContent =
          'Account activated successfully!';

          setTimeout(() => {

            window.location.href =
            '/client-dashboard.html';

          },1500);

          return;

        }

        // =====================
        // LOGIN
        // =====================

        const {
          data,
          error
        } = await supabase.auth.signInWithPassword({

          email,
          password

        });

        if(error){

          msg.textContent =
          error.message;

          return;

        }

        msg.textContent =
        'Success! Redirecting...';

        setTimeout(() => {

          window.location.href =
          '/client-dashboard.html';

        },1200);

      }
    );

  </script>

</body>

</html>
