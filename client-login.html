<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Client Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:white;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at top,#7c3aed22,transparent 40%),
radial-gradient(circle at bottom,#8b5cf622,transparent 40%);
}

.card{
width:460px;
background:#070b18;
border:1px solid rgba(255,255,255,.06);
border-radius:30px;
padding:40px;
position:relative;
z-index:2;
box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
font-size:62px;
font-weight:800;
margin-bottom:18px;
background:linear-gradient(135deg,#fff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
color:#9ca3af;
font-size:18px;
margin-bottom:34px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:24px;
background:#0f172a;
padding:6px;
border-radius:20px;
}

.tab{
flex:1;
padding:16px;
border:none;
border-radius:16px;
background:transparent;
color:#94a3b8;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.tab.active{
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
box-shadow:0 0 25px rgba(139,92,246,.35);
}

.input{
width:100%;
padding:20px;
border:none;
border-radius:18px;
background:#0f172a;
margin-bottom:18px;
color:white;
font-size:18px;
outline:none;
border:1px solid transparent;
}

.input:focus{
border-color:#8b5cf6;
}

.btn{
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
font-size:20px;
font-weight:800;
cursor:pointer;
margin-top:10px;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.msg{
margin-top:18px;
color:#9ca3af;
line-height:1.6;
font-size:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="logo">
NexaDesk
</div>

<div
class="sub"
id="subText"
>
Secure client portal access
</div>

<div class="tabs">

<button
id="loginTab"
class="tab active"
type="button"
>
Login
</button>

<button
id="activateTab"
class="tab"
type="button"
>
Activate Account
</button>

</div>

<input
type="email"
id="email"
class="input"
placeholder="Business email"
/>

<input
type="password"
id="password"
class="input"
placeholder="Password"
/>

<button
id="submitBtn"
class="btn"
type="button"
>
Login
</button>

<div
id="msg"
class="msg"
></div>

</div>

<script>

// ======================
// SUPABASE
// ======================

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

// ======================
// ELEMENTS
// ======================

const loginTab =
document.getElementById('loginTab');

const activateTab =
document.getElementById('activateTab');

const passwordInput =
document.getElementById('password');

const submitBtn =
document.getElementById('submitBtn');

const subText =
document.getElementById('subText');

const msg =
document.getElementById('msg');

const emailInput =
document.getElementById('email');

let mode = 'login';

// ======================
// SWITCH LOGIN
// ======================

function setLoginMode(){

mode = 'login';

loginTab.classList.add('active');
activateTab.classList.remove('active');

passwordInput.style.display =
'block';

passwordInput.value = '';

submitBtn.textContent =
'Login';

subText.textContent =
'Secure client portal access';

msg.textContent = '';

}

// ======================
// SWITCH ACTIVATE
// ======================

function setActivateMode(){

mode = 'activate';

activateTab.classList.add('active');
loginTab.classList.remove('active');

passwordInput.style.display =
'none';

passwordInput.value = '';

submitBtn.textContent =
'Send Activation Link';

subText.textContent =
'Activate your business portal';

msg.textContent = '';

}

// ======================
// CLICK EVENTS
// ======================

loginTab.addEventListener(
'click',
setLoginMode
);

activateTab.addEventListener(
'click',
setActivateMode
);

// ======================
// SUBMIT
// ======================

submitBtn.addEventListener(
'click',
async () => {

const email =
emailInput.value.trim();

const password =
passwordInput.value.trim();

if(!email){

msg.textContent =
'Please enter your email';

return;

}

// ======================
// ACTIVATE
// ======================

if(mode === 'activate'){

msg.textContent =
'Checking account...';

const {
data: client
} = await supabase
.from('Clients')
.select('*')
.eq('contact_email', email)
.single();

if(!client){

msg.textContent =
'No business account found for this email';

return;

}

const {
error
} = await supabase.auth.signInWithOtp({

email,

options:{
emailRedirectTo:
'https://nexadesk.co.uk/create-password.html'
}

});

if(error){

msg.textContent =
error.message;

return;

}

msg.textContent =
'Activation email sent successfully.';

return;

}

// ======================
// LOGIN
// ======================

if(!password){

msg.textContent =
'Please enter your password';

return;

}

const {
error
} = await supabase.auth.signInWithPassword({

email,
password

});

if(error){

msg.textContent =
error.message;

return;

}

window.location.href =
'/client-dashboard.html';

}
);

</script>

</body>

</html>
