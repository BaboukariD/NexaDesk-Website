<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Client Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:white;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at top,#7c3aed22,transparent 40%),
radial-gradient(circle at bottom,#8b5cf622,transparent 40%);
}

.card{
width:430px;
background:rgba(10,12,25,.95);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:42px;
position:relative;
z-index:2;
backdrop-filter:blur(12px);
box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
font-size:34px;
font-weight:700;
margin-bottom:10px;
background:linear-gradient(135deg,#fff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
color:#9ca3af;
margin-bottom:30px;
font-size:16px;
}

.tabs{
display:flex;
gap:12px;
margin-bottom:26px;
}

.tab{
flex:1;
padding:15px;
border:none;
border-radius:16px;
background:#111827;
color:#d1d5db;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

.tab:hover{
background:#1f2937;
color:white;
}

.tab.active{
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
box-shadow:
0 10px 30px rgba(139,92,246,.35);
}

.title{
font-size:26px;
font-weight:700;
margin-bottom:10px;
}

.desc{
color:#9ca3af;
margin-bottom:26px;
line-height:1.5;
}

.input{
width:100%;
padding:16px;
margin-bottom:16px;
border:none;
border-radius:16px;
background:#111827;
color:white;
outline:none;
font-size:15px;
border:1px solid transparent;
transition:.2s;
}

.input:focus{
border-color:#8b5cf6;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(
135deg,
#8b5cf6,
#7c3aed
);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-1px);
}

.msg{
margin-top:18px;
text-align:center;
font-size:14px;
color:#9ca3af;
line-height:1.5;
min-height:20px;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="logo">
NexaDesk
</div>

<div class="sub">
Secure client portal access
</div>

<div class="tabs">

<button
id="loginTab"
class="tab active"
type="button"
>
Login
</button>

<button
id="activateTab"
class="tab"
type="button"
>
Activate Account
</button>

</div>

<div
class="title"
id="formTitle"
>
Welcome Back
</div>

<div
class="desc"
id="formDesc"
>
Login to access your client dashboard.
</div>

<input
type="email"
id="email"
class="input"
placeholder="Business email"
/>

<input
type="password"
id="password"
class="input"
placeholder="Password"
/>

<button
id="submitBtn"
class="btn"
type="button"
>
Login
</button>

<div
id="msg"
class="msg"
></div>

</div>

<script>

// =====================
// SUPABASE
// =====================

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg'';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

// =====================
// ELEMENTS
// =====================

const loginTab =
document.getElementById('loginTab');

const activateTab =
document.getElementById('activateTab');

const formTitle =
document.getElementById('formTitle');

const formDesc =
document.getElementById('formDesc');

const submitBtn =
document.getElementById('submitBtn');

const emailInput =
document.getElementById('email');

const passwordInput =
document.getElementById('password');

const msg =
document.getElementById('msg');

let mode = 'login';

// =====================
// SWITCH MODE
// =====================

function switchMode(newMode){

mode = newMode;

// remove active
loginTab.classList.remove('active');
activateTab.classList.remove('active');

// LOGIN MODE
if(mode === 'login'){

loginTab.classList.add('active');

formTitle.textContent =
'Welcome Back';

formDesc.textContent =
'Login to access your client dashboard.';

submitBtn.textContent =
'Login';

emailInput.placeholder =
'Business email';

passwordInput.placeholder =
'Password';

}

// ACTIVATE MODE
else{

activateTab.classList.add('active');

formTitle.textContent =
'Activate Your Account';

formDesc.textContent =
'Create your secure client portal password.';

submitBtn.textContent =
'Activate Account';

emailInput.placeholder =
'Client email address';

passwordInput.placeholder =
'Create password';

}

msg.textContent = '';

}

// =====================
// TAB EVENTS
// =====================

loginTab.onclick = () => {
switchMode('login');
};

activateTab.onclick = () => {
switchMode('activate');
};

// =====================
// BUTTON
// =====================

submitBtn.onclick = async () => {

const email =
emailInput.value.trim();

const password =
passwordInput.value.trim();

if(!email || !password){

msg.textContent =
'Please fill in all fields';

return;

}

// =====================
// ACTIVATE ACCOUNT
// =====================

if(mode === 'activate'){

msg.textContent =
'Activating account...';

const {
data: clients,
error: clientError
} = await supabase
.from('Clients')
.select('*')
.eq('contact_email', email);

if(
clientError ||
!clients ||
clients.length === 0
){

msg.textContent =
'This email is not registered as a NexaDesk client.';

return;

}

const client =
clients[0];

const {
data,
error
} = await supabase.auth.signUp({

email,
password

});

if(error){

msg.textContent =
error.message;

return;

}

const {
error: linkError
} = await supabase
.from('ClientUsers')
.insert({

auth_user_id:
data.user.id,

client_id:
client.id,

email

});

if(linkError){

msg.textContent =
linkError.message;

return;

}

msg.textContent =
'Account activated successfully!';

setTimeout(() => {

window.location.href =
'/client-dashboard.html';

},1500);

return;

}

// =====================
// LOGIN
// =====================

msg.textContent =
'Logging in...';

const {
data,
error
} = await supabase.auth.signInWithPassword({

email,
password

});

if(error){

msg.textContent =
error.message;

return;

}

msg.textContent =
'Success! Redirecting...';

setTimeout(() => {

window.location.href =
'/client-dashboard.html';

},1200);

};

</script>

</body>

</html>
