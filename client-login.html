<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaDesk Client Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

body {
  background: #050816;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #7c3aed22, transparent 50%),
    radial-gradient(circle at 80% 80%, #8b5cf622, transparent 50%);
  pointer-events: none;
}

.card {
  width: 440px;
  background: rgba(10, 12, 25, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px;
  padding: 44px;
  position: relative;
  z-index: 2;
  backdrop-filter: blur(16px);
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
}

.logo {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #fff, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 32px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
  background: #0d1117;
  padding: 6px;
  border-radius: 16px;
}

.tab {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: transparent;
  color: #6b7280;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab:hover {
  color: #d1d5db;
}

.tab.active {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: white;
  box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
}

.form-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  color: white;
}

.form-desc {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 24px;
  line-height: 1.6;
}

.input {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 14px;
  background: #0d1117;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 14px;
  color: white;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.input:focus {
  border-color: #8b5cf6;
}

.input::placeholder {
  color: #4b5563;
}

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 4px;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.msg {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  line-height: 1.6;
  min-height: 20px;
}

.msg.error   { color: #f87171; }
.msg.success { color: #34d399; }

.success-box {
  display: none;
  text-align: center;
  padding: 24px;
}

.success-box .icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.success-box h3 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}

.success-box p {
  color: #6b7280;
  font-size: 14px;
  line-height: 1.6;
}

</style>
</head>
<body>

<div class="bg"></div>

<div class="card">

  <div class="logo">NexaDesk</div>
  <div class="sub">Secure client portal access</div>

  <div id="mainForm">

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">Login</button>
      <button class="tab" id="activateTab" type="button">Activate Account</button>
    </div>

    <div class="form-title" id="formTitle">Welcome back</div>
    <div class="form-desc" id="formDesc">Login to access your dashboard and leads.</div>

    <input type="email" id="email" class="input" placeholder="Email address" />
    <input type="password" id="password" class="input" placeholder="Password" />

    <button class="btn" id="submitBtn" type="button">Login</button>

    <div class="msg" id="msg"></div>

  </div>

  <div class="success-box" id="successBox">
    <div class="icon">📧</div>
    <h3>Check your email</h3>
    <p>We've sent a magic link to your email address.<br>Click it to activate your account and set your password.</p>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginTab    = document.getElementById('loginTab');
const activateTab = document.getElementById('activateTab');
const formTitle   = document.getElementById('formTitle');
const formDesc    = document.getElementById('formDesc');
const submitBtn   = document.getElementById('submitBtn');
const emailInput  = document.getElementById('email');
const passInput   = document.getElementById('password');
const msg         = document.getElementById('msg');
const mainForm    = document.getElementById('mainForm');
const successBox  = document.getElementById('successBox');

let mode = 'login';

function setMsg(text, type = '') {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

function switchMode(newMode) {
  mode = newMode;
  loginTab.classList.remove('active');
  activateTab.classList.remove('active');
  setMsg('');

  if (mode === 'login') {
    loginTab.classList.add('active');
    formTitle.textContent = 'Welcome back';
    formDesc.textContent = 'Login to access your dashboard and leads.';
    submitBtn.textContent = 'Login';
    passInput.style.display = 'block';
    emailInput.placeholder = 'Email address';
  } else {
    activateTab.classList.add('active');
    formTitle.textContent = 'Activate your account';
    formDesc.textContent = 'Enter the email we have on file. We\'ll send you a link to set up your password.';
    submitBtn.textContent = 'Send Activation Link';
    passInput.style.display = 'none';
    emailInput.placeholder = 'Email address';
  }
}

loginTab.addEventListener('click', () => switchMode('login'));
activateTab.addEventListener('click', () => switchMode('activate'));

submitBtn.addEventListener('click', async () => {
  const email    = emailInput.value.trim();
  const password = passInput.value.trim();

  if (!email) {
    setMsg('Please enter your email address.', 'error');
    return;
  }

  if (mode === 'login' && !password) {
    setMsg('Please enter your password.', 'error');
    return;
  }

  submitBtn.disabled = true;
  setMsg('');

  // ── ACTIVATE — send magic link ─────────────────────────────────
  if (mode === 'activate') {

    // Check email exists in Clients table
    const { data: clients, error: clientErr } = await sb
      .from('Clients')
      .select('id, business_name')
      .eq('contact_email', email);

    if (clientErr || !clients || clients.length === 0) {
      setMsg('This email isn\'t registered with NexaDesk. Contact us if you think this is wrong.', 'error');
      submitBtn.disabled = false;
      return;
    }

    // Send magic link via Supabase
    const { error: otpErr } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: 'https://nexadesk.co.uk/client-dashboard.html'
      }
    });

    if (otpErr) {
      setMsg(otpErr.message, 'error');
      submitBtn.disabled = false;
      return;
    }

    // Show success screen
    mainForm.style.display = 'none';
    successBox.style.display = 'block';
    return;
  }

  // ── LOGIN — email + password ───────────────────────────────────
  const { error: loginErr } = await sb.auth.signInWithPassword({ email, password });

  if (loginErr) {
    setMsg(loginErr.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Login';
    return;
  }

  setMsg('Login successful! Redirecting...', 'success');
  setTimeout(() => { window.location.href = '/client-dashboard.html'; }, 1200);
});
</script>

</body>
</html>
