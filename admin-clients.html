<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexaDesk — Manage Clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#0b1020;color:white;display:flex;min-height:100vh;}
.sidebar{width:240px;background:#121933;padding:30px 20px;border-right:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.logo{font-size:1.4rem;font-weight:700;margin-bottom:40px;background:linear-gradient(90deg,#7c5cff,#5ce1e6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-item{padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.2s;color:#cfd6ff;text-decoration:none;display:block;}
.nav-item:hover{background:#1a2345;}
.nav-item.active{background:#1a2345;color:white;}
.main{flex:1;padding:40px;overflow-y:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.topbar h1{font-size:2rem;}
.btn-primary{background:linear-gradient(135deg,#7c5cff,#9b7bff);border:none;color:white;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;font-family:'DM Sans',sans-serif;transition:.2s;}
.btn-primary:hover{opacity:.85;}
.table-wrap{background:#151d3b;border-radius:18px;border:1px solid rgba(255,255,255,.06);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;}
th{color:#9da8d6;font-weight:500;}
.badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.badge.active{background:#1a3a2a;color:#34d399;}
.badge.inactive{background:#3a1a1a;color:#f87171;}
.badge.starter{background:#1e2a56;color:#a78bfa;}
.badge.growth{background:#1a3040;color:#60a5fa;}
.badge.pro{background:#2a1a40;color:#c084fc;}
.copy-btn{background:#1e2a56;border:none;color:#a78bfa;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.2s;}
.copy-btn:hover{background:#2a3a6a;}
.toggle-btn{border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.2s;}
.toggle-btn.deactivate{background:#3a1a1a;color:#f87171;}
.toggle-btn.activate{background:#1a3a2a;color:#34d399;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#151d3b;border-radius:20px;border:1px solid rgba(255,255,255,.08);width:520px;max-width:90vw;padding:32px;}
.modal h2{font-size:1.4rem;margin-bottom:24px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:#9da8d6;margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;background:#0b1020;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:white;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;}
.field textarea{min-height:120px;resize:vertical;line-height:1.6;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7c5cff;}
.field select option{background:#0b1020;}
.modal-btns{display:flex;gap:12px;margin-top:24px;}
.btn-cancel{background:#1e2a56;border:none;color:#9da8d6;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif;}
.modal-msg{margin-top:14px;font-size:13px;color:#9da8d6;min-height:20px;}
.modal-msg.success{color:#34d399;}
.modal-msg.error{color:#f87171;}
.empty{padding:40px;text-align:center;color:#6b7280;}
</style>
</head>
<body style="visibility:hidden">

<script>
const password = prompt("Enter password to access dashboard:");
sessionStorage.setItem('nd_auth', password);
</script>

<div class="sidebar">
  <div class="logo">NexaDesk</div>
  <a class="nav-item" href="/dashboard.html">Dashboard</a>
  <a class="nav-item active" href="/admin-clients.html">Clients</a>
  <a class="nav-item" href="/leads.html">Leads</a>
</div>

<div class="main">
  <div class="topbar">
    <h1>Manage Clients</h1>
    <button class="btn-primary" id="addClientBtn">+ Add Client</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Business</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Plan</th>
          <th>Status</th>
          <th>Embed Code</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="clientsTable"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">No clients yet.</div>
  </div>
</div>

<!-- ADD CLIENT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add New Client</h2>
    <div class="field"><label>Business Name</label><input id="f_business_name" placeholder="Joe's Pizza"/></div>
    <div class="field"><label>Contact Name</label><input id="f_contact_name" placeholder="Joe Smith"/></div>
    <div class="field"><label>Contact Email</label><input id="f_contact_email" type="email" placeholder="joe@joespizza.com"/></div>
    <div class="field"><label>Website</label><input id="f_website" placeholder="https://joespizza.com"/></div>
    <div class="field"><label>Plan</label>
      <select id="f_plan">
        <option value="starter">Starter — £49/mo</option>
        <option value="growth">Growth — £99/mo</option>
        <option value="pro">Pro — £199/mo</option>
      </select>
    </div>
    <div class="field"><label>System Prompt (AI instructions)</label><textarea id="f_system_prompt" placeholder="You are a friendly assistant for Joe's Pizza..."></textarea></div>
    <div class="modal-btns">
      <button class="btn-primary" id="saveClientBtn">Save Client</button>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
    </div>
    <div class="modal-msg" id="modalMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://exqdmvloldvshzpxevht.supabase.co";
const SUPABASE_KEY = "sb_publishable__bJTNHHD95Uop41LMarPsQ_zjZzk4af";

const PASSWORD = "PasswordBabusabi123!";

async function api(method, path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: method === 'POST' ? 'return=representation' : 'return=minimal'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
}

function embedCode(id) {
  return `<script src="https://nexadesk.co.uk/embed.js" data-client-id="${id}"><\/script>`;
}

async function loadClients() {
  const clients = await api('GET', 'Clients?select=*&order=created_at.desc');
  const table = document.getElementById('clientsTable');
  const empty = document.getElementById('emptyState');
  table.innerHTML = '';

  if (!clients || !clients.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  clients.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${c.business_name || '—'}</strong></td>
      <td>${c.contact_name || '—'}</td>
      <td>${c.contact_email || '—'}</td>
      <td><span class="badge ${c.plan || 'starter'}">${c.plan || 'starter'}</span></td>
      <td><span class="badge ${c.is_active ? 'active' : 'inactive'}">${c.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><button class="copy-btn" onclick="copyEmbed(${c.id})">Copy Embed</button></td>
      <td>
        <button class="toggle-btn ${c.is_active ? 'deactivate' : 'activate'}" onclick="toggleActive(${c.id}, ${c.is_active})">
          ${c.is_active ? 'Deactivate' : 'Activate'}
        </button>
      </td>
    `;
    table.appendChild(tr);
  });
}

function copyEmbed(id) {
  navigator.clipboard.writeText(embedCode(id));
  alert(`Copied! Send this to client ${id}:\n\n${embedCode(id)}`);
}

async function toggleActive(id, current) {
  await api('PATCH', `Clients?id=eq.${id}`, { is_active: !current });
  loadClients();
}

// Modal
const overlay = document.getElementById('modalOverlay');
const modalMsg = document.getElementById('modalMsg');

document.getElementById('addClientBtn').onclick = () => {
  ['f_business_name','f_contact_name','f_contact_email','f_website','f_system_prompt'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_plan').value = 'starter';
  modalMsg.textContent = '';
  overlay.classList.add('open');
};

document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if(e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('saveClientBtn').onclick = async () => {
  const business_name  = document.getElementById('f_business_name').value.trim();
  const contact_name   = document.getElementById('f_contact_name').value.trim();
  const contact_email  = document.getElementById('f_contact_email').value.trim();
  const website        = document.getElementById('f_website').value.trim();
  const plan           = document.getElementById('f_plan').value;
  const system_prompt  = document.getElementById('f_system_prompt').value.trim();

  if (!business_name || !contact_email) {
    modalMsg.textContent = 'Business name and email are required.';
    modalMsg.className = 'modal-msg error';
    return;
  }

  modalMsg.textContent = 'Saving...';
  modalMsg.className = 'modal-msg';

  const result = await api('POST', 'Clients', {
    business_name, contact_name, contact_email,
    website, plan, system_prompt, is_active: true
  });

  if (result?.error || (Array.isArray(result) && result[0]?.code)) {
    modalMsg.textContent = result.message || result[0]?.message || 'Error saving client.';
    modalMsg.className = 'modal-msg error';
    return;
  }

  const newId = Array.isArray(result) ? result[0]?.id : result?.id;
  modalMsg.textContent = `Client saved! ID: ${newId}`;
  modalMsg.className = 'modal-msg success';
  loadClients();
  setTimeout(() => overlay.classList.remove('open'), 1500);
};

// Auth + init
const entered = sessionStorage.getItem('nd_auth');
if (entered === PASSWORD) {
  loadClients();
  document.body.style.visibility = 'visible';
} else {
  document.body.style.visibility = 'visible';
  document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:40vh;font-family:sans-serif'>Access Denied</h1>";
}
</script>
</body>
</html>
