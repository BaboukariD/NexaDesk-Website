<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>NexaDesk</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050816;
  color:white;
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

.bg-glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background:
    radial-gradient(circle at 20% 20%, rgba(139,92,246,0.16), transparent 30%),
    radial-gradient(circle at 80% 60%, rgba(99,102,241,0.12), transparent 30%);
}

/* =========================
   NAVBAR
========================= */

.navbar{
  width:100%;
  height:84px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 48px;

  border-bottom:1px solid rgba(255,255,255,0.06);

  position:sticky;
  top:0;

  background:rgba(5,8,22,0.85);

  backdrop-filter:blur(14px);

  z-index:100;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  height:48px;
  width:auto;
  object-fit:contain;
  display:block;
}

.logo-text{
  font-size:32px;
  font-weight:800;

  background:linear-gradient(
    90deg,
    #ffffff,
    #9b6bff
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  letter-spacing:-1px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:34px;
}

.nav-links a{
  color:#9f9db7;
  text-decoration:none;
  font-size:15px;
  transition:0.2s;
}

.nav-links a:hover{
  color:white;
}

.demo-btn{
  padding:14px 24px;
  border-radius:14px;

  background:#8b5cf6;

  color:white !important;

  font-weight:700;

  transition:0.2s;
}

.demo-btn:hover{
  transform:translateY(-2px);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:calc(100vh - 84px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:80px 24px;

  position:relative;
  z-index:2;
}

.hero-badge{
  margin-bottom:28px;

  border:1px solid rgba(139,92,246,0.4);

  background:rgba(139,92,246,0.1);

  color:#b89cff;

  padding:12px 22px;

  border-radius:999px;

  font-size:14px;
  font-weight:600;

  display:flex;
  align-items:center;
  gap:10px;
}

.hero h1{
  font-size:clamp(58px,8vw,120px);

  line-height:0.95;

  letter-spacing:-4px;

  max-width:1300px;

  font-weight:800;

  margin-bottom:34px;
}

.gradient{
  background:linear-gradient(
    90deg,
    #8b5cf6,
    #b993ff
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:760px;

  color:#8f90aa;

  font-size:24px;

  line-height:1.7;

  margin-bottom:48px;
}

.hero-actions{
  display:flex;
  align-items:center;
  gap:20px;
}

.primary-btn{
  background:#8b5cf6;

  color:white;

  text-decoration:none;

  padding:20px 34px;

  border-radius:18px;

  font-weight:700;

  font-size:18px;

  transition:0.2s;
}

.primary-btn:hover{
  transform:translateY(-2px);
}

.secondary-btn{
  border:1px solid rgba(255,255,255,0.08);

  color:white;

  text-decoration:none;

  padding:20px 34px;

  border-radius:18px;

  font-weight:600;

  font-size:18px;
}

/* =========================
   CHAT WIDGET SPACE
========================= */

#nexadesk-chatbot{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:9999;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .navbar{
    padding:0 22px;
  }

  .logo-text{
    font-size:24px;
  }

  .nav-links{
    gap:18px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .hero p{
    font-size:18px;
  }

  .hero-actions{
    flex-direction:column;
    width:100%;
  }

  .primary-btn,
  .secondary-btn{
    width:100%;
    text-align:center;
  }

}

</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

  <div class="logo-wrap">

    <img
      src="./nexadesk-logo.png"
      alt="NexaDesk"
      class="logo-icon"
    />

    <div class="logo-text">
      NexaDesk
    </div>

  </div>

  <nav class="nav-links">

    <a href="#how">
      How it works
    </a>

    <a href="#features">
      Features
    </a>

    <a href="#pricing">
      Pricing
    </a>

    <a href="#demo" class="demo-btn">
      Book a Demo
    </a>

  </nav>

</header>

<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-badge">
    ● AI-POWERED CUSTOMER SERVICE
  </div>

  <h1>
    Turn every visitor<br>
    into a <span class="gradient">customer</span>
  </h1>

  <p>
    NexaDesk gives your business a 24/7 AI assistant
    that answers questions, captures leads,
    and converts visitors automatically.
  </p>

  <div class="hero-actions">

    <a href="#demo" class="primary-btn">
      Book a Free Demo →
    </a>

    <a href="#how" class="secondary-btn">
      See how it works
    </a>

  </div>

</section>

<!-- =========================
     CHATBOT
========================= -->

<script src="./embed.js"></script>

</body>
</html>
