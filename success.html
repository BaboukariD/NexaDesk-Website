<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Successful — NexaDesk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}
body{background:#050816;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#2563EB22,transparent 50%),radial-gradient(circle at 80% 80%,#3B82F622,transparent 50%);pointer-events:none;}
.card{width:100%;max-width:500px;background:#070b18;border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:52px 44px;text-align:center;position:relative;z-index:2;box-shadow:0 25px 80px rgba(0,0,0,.5);}
.icon{font-size:64px;margin-bottom:24px;}
h1{font-size:32px;font-weight:800;margin-bottom:14px;}
p{color:#6b7280;line-height:1.7;margin-bottom:32px;}
.btn{display:inline-block;padding:16px 32px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:white;text-decoration:none;border-radius:16px;font-weight:700;font-size:16px;transition:.2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(59,130,246,.4);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="icon">🎉</div>
  <h1>You're all set!</h1>
  <p>Your NexaDesk subscription is now active. We'll be in touch shortly to get your AI assistant live on your website.</p>
  <a href="/" class="btn">Back to NexaDesk</a>
</div>
</body>
</html>
