<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Conversations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
padding:40px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;
}

.logo{
font-size:32px;
font-weight:800;
background:linear-gradient(
135deg,
#fff,
#8b5cf6
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.back{
color:#8b5cf6;
text-decoration:none;
font-weight:600;
}

.search{
width:100%;
padding:16px;
background:#111827;
border:none;
border-radius:16px;
color:white;
font-size:15px;
margin-bottom:24px;
outline:none;
}

.conversations{
display:flex;
flex-direction:column;
gap:18px;
height:75vh;
overflow-y:auto;
padding-right:6px;
}

.card{
background:#111827;
padding:22px;
border-radius:20px;
border:1px solid rgba(255,255,255,.06);
}

.time{
font-size:13px;
color:#9ca3af;
margin-bottom:14px;
}

.text{
white-space:pre-wrap;
line-height:1.7;
font-size:14px;
}

.empty{
text-align:center;
padding:40px;
color:#6b7280;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
NexaDesk
</div>

<a
href="/client-dashboard.html"
class="back"
>
← Back to Dashboard
</a>

</div>

<input
type="text"
id="searchInput"
class="search"
placeholder="Search conversations..."
/>

<div
class="conversations"
id="conversationList"
>
</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'YOUR_REAL_ANON_KEY';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let allConversations = [];

function formatTime(dateString){

const date =
new Date(dateString);

return date.toLocaleString(
'en-GB',
{
day:'numeric',
month:'short',
year:'numeric',
hour:'2-digit',
minute:'2-digit'
}
);

}

function renderConversations(items){

const list =
document.getElementById(
'conversationList'
);

list.innerHTML = '';

if(!items.length){

list.innerHTML = `

<div class="empty">
No conversations found.
</div>

`;

return;

}

for(const convo of items){

list.innerHTML += `

<div class="card">

<div class="time">

${formatTime(convo.created_at)}

</div>

<div class="text">

${
convo.messages?.[0]?.content
|| 'No conversation'
}

</div>

</div>

`;

}

}

async function loadConversations(){

const {
data:{ session }
} = await sb.auth.getSession();

if(!session){

window.location.href =
'/client-login.html';

return;

}

const user =
session.user;

const {
data:client
} = await sb
.from('Clients')
.select('*')
.eq(
'contact_email',
user.email
)
.maybeSingle();

if(!client){

return;

}

const {
data:conversations
} = await sb
.from('Conversations')
.select('*')
.eq(
'client_id',
client.id
)
.order(
'created_at',
{ ascending:false }
);

allConversations =
conversations || [];

renderConversations(
allConversations
);

}

document.getElementById(
'searchInput'
).addEventListener(
'input',
(e)=>{

const query =
e.target.value
.toLowerCase();

const filtered =
allConversations.filter(
c =>

(c.message || '')
.toLowerCase()
.includes(query)

);

renderConversations(
filtered
);

}
);

loadConversations();

</script>

</body>

</html>
