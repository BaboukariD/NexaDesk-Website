<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>NexaDesk Conversations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
}

/* =========================
LAYOUT
========================= */

.app{
display:flex;
height:100vh;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:380px;
background:#0b1020;
border-right:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
}

.logo{
padding:28px;
font-size:32px;
font-weight:800;
background:linear-gradient(
135deg,
#fff,
#8b5cf6
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.search-wrap{
padding:0 20px 20px;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#111827;
color:white;
outline:none;
font-size:14px;
}

.search::placeholder{
color:#6b7280;
}

/* =========================
CONVERSATION LIST
========================= */

.conversation-list{
flex:1;
overflow-y:auto;
padding:0 14px 20px;
}

.conversation-item{
background:#111827;
border:1px solid transparent;
padding:18px;
border-radius:18px;
margin-bottom:14px;
cursor:pointer;
transition:.2s;
}

.conversation-item:hover{
border-color:#8b5cf6;
transform:translateY(-1px);
}

.conversation-item.active{
border-color:#8b5cf6;
background:#141c30;
}

.conversation-name{
font-size:15px;
font-weight:700;
margin-bottom:6px;
}

.conversation-preview{
font-size:13px;
color:#9ca3af;
line-height:1.5;
overflow:hidden;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
}

.conversation-time{
font-size:12px;
color:#6b7280;
margin-top:10px;
}

/* =========================
CHAT AREA
========================= */

.chat-area{
flex:1;
display:flex;
flex-direction:column;
background:#050816;
}

.chat-header{
padding:24px 30px;
border-bottom:1px solid rgba(255,255,255,.06);
display:flex;
justify-content:space-between;
align-items:center;
}

.chat-title{
font-size:22px;
font-weight:700;
}

.back-btn{
color:#8b5cf6;
text-decoration:none;
font-weight:600;
}

.messages{
flex:1;
overflow-y:auto;
padding:30px;
display:flex;
flex-direction:column;
gap:18px;
}

.message{
max-width:75%;
padding:16px 18px;
border-radius:18px;
line-height:1.7;
font-size:14px;
white-space:pre-wrap;
}

.user{
background:#8b5cf6;
align-self:flex-end;
}

.bot{
background:#111827;
align-self:flex-start;
border:1px solid rgba(255,255,255,.05);
}

.empty-chat{
margin:auto;
color:#6b7280;
font-size:15px;
}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#2a3245;
border-radius:20px;
}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

.app{
flex-direction:column;
}

.sidebar{
width:100%;
height:320px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.06);
}

.chat-area{
height:calc(100vh - 320px);
}

.message{
max-width:90%;
}

}

</style>

</head>

<body>

<div class="app">

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

<div class="logo">
  <img
    src="./nexadesk-logo.png"
    alt="NexaDesk"
    style="
      width:220px;
      max-width:100%;
      object-fit:contain;
    "
  />
</div>

<div class="search-wrap">

<input
type="text"
class="search"
id="searchInput"
placeholder="Search conversations..."
/>

</div>

<div
class="conversation-list"
id="conversationList"
>
</div>

</div>

<!-- =========================
CHAT AREA
========================= -->

<div class="chat-area">

<div class="chat-header">

<div class="chat-title">
Conversation Viewer
</div>

<a
href="/client-dashboard.html"
class="back-btn"
>
← Dashboard
</a>

</div>

<div
class="messages"
id="messages"
>

<div class="empty-chat">
Select a conversation
</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
'https://exqdmvloldvshzpxevht.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let allConversations = [];

function formatTime(dateString){

const date =
new Date(dateString);

return date.toLocaleString(
'en-GB',
{
day:'numeric',
month:'short',
hour:'2-digit',
minute:'2-digit'
}
);

}

function getPreview(messages){

if(!messages || !Array.isArray(messages))
return 'No messages';

const first =
messages[0];

return first?.content || 'Empty conversation';

}

function renderConversationList(items){

const list =
document.getElementById(
'conversationList'
);

list.innerHTML = '';

if(!items.length){

list.innerHTML = `
<div
style="
padding:20px;
color:#6b7280;
"
>
No conversations found
</div>
`;

return;

}

items.forEach((convo,index)=>{

const item =
document.createElement('div');

item.className =
'conversation-item';

item.innerHTML = `

<div class="conversation-name">
Conversation #${index + 1}
</div>

<div class="conversation-preview">
${getPreview(convo.messages)}
</div>

<div class="conversation-time">
${formatTime(convo.created_at)}
</div>

`;

item.addEventListener(
'click',
()=>{

document
.querySelectorAll(
'.conversation-item'
)
.forEach(el=>
el.classList.remove('active')
);

item.classList.add('active');

renderMessages(
convo.messages
);

}
);

list.appendChild(item);

});

}

function renderMessages(messages){

const container =
document.getElementById(
'messages'
);

container.innerHTML = '';

if(
!messages ||
!Array.isArray(messages)
){

container.innerHTML = `
<div class="empty-chat">
No messages
</div>
`;

return;

}

messages.forEach(msg=>{

const bubble =
document.createElement('div');

bubble.className =
`message ${
msg.role === 'user'
? 'user'
: 'bot'
}`;

bubble.textContent =
msg.content || '';

container.appendChild(
bubble
);

});

container.scrollTop =
container.scrollHeight;

}

async function loadConversations(){

const {
data,
error
} = await sb
.from('Conversations')
.select('*')
.order(
'created_at',
{
ascending:false
}
);

if(error){

console.error(error);
return;

}

allConversations =
data || [];

renderConversationList(
allConversations
);

}

document.getElementById(
'searchInput'
).addEventListener(
'input',
(e)=>{

const query =
e.target.value
.toLowerCase();

const filtered =
allConversations.filter(c=>{

const text =
JSON.stringify(
c.messages || []
).toLowerCase();

return text.includes(query);

});

renderConversationList(
filtered
);

}
);

loadConversations();

</script>

</body>

</html>
