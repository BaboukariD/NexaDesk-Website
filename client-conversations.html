<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conversations — NexaDesk</title>
<link rel="stylesheet" href="/portal.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <a class="sidebar-logo" href="/client-dashboard.html"><img src="./nexadesk-logo.png" alt="NexaDesk"/></a>

    <a class="side-link" href="/client-dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Overview
    </a>
    <a class="side-link active" href="/client-conversations.html">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Conversations
    </a>
    <a class="side-link" href="/client-analytics.html">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
      Analytics
    </a>
    <a class="side-link" href="/client-knowledge.html">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      AI Knowledge
    </a>
    <a class="side-link" href="/client-account.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Account
    </a>

    <div class="sidebar-foot">
      <button class="logout-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="page-head">
      <h1 class="page-title">Conversations</h1>
      <p class="page-sub">Every chat your assistant has had with website visitors.</p>
    </div>

    <div class="convo-shell">
      <div class="convo-list-pane">
        <div class="convo-search-wrap" style="display:flex;gap:8px;">
          <input type="text" class="input" id="searchInput" placeholder="Search conversations…" style="flex:1;min-width:0;"/>
          <select class="input" id="sortSelect" style="width:auto;flex-shrink:0;padding-right:34px;" aria-label="Sort conversations">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
        <div class="convo-list" id="conversationList">
          <div class="empty-state">Loading conversations…</div>
        </div>
      </div>

      <div class="convo-chat-pane">
        <div class="convo-chat-head">
          <div class="convo-chat-title" id="chatTitle">Conversation viewer</div>
          <div class="convo-chat-sub" id="chatSubtitle">Select a conversation to read it</div>
        </div>
        <div class="convo-messages" id="messages">
          <div class="convo-empty">Select a conversation from the list</div>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allConversations = [];
let activeConversationId = null;

function formatTime(dateString){
  return new Date(dateString).toLocaleString('en-GB',{ day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function getPreview(messages){
  if(!messages || !Array.isArray(messages)) return 'No messages';
  const firstUserMessage = messages.find(m => m.role === 'user');
  const firstMessage = firstUserMessage || messages[0];
  return firstMessage?.content || 'Empty conversation';
}

function escapeHtml(value){
  return String(value)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

function renderConversationList(items){
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  if(!items.length){
    list.innerHTML = '<div class="empty-state">No conversations found.</div>';
    return;
  }

  items.forEach((convo) => {
    const item = document.createElement('div');
    item.className = 'convo-item';
    if(convo.id === activeConversationId) item.classList.add('active');

    item.innerHTML = `
      <div class="convo-name">Conversation #${convo._num}</div>
      <div class="convo-preview">${escapeHtml(getPreview(convo.messages))}</div>
      <div class="convo-time">${formatTime(convo.created_at)}</div>
    `;

    item.addEventListener('click', () => {
      activeConversationId = convo.id;
      document.querySelectorAll('.convo-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      renderMessages(convo);
    });

    list.appendChild(item);
  });
}

function renderMessages(convo){
  const container = document.getElementById('messages');
  const messages = convo.messages;

  document.getElementById('chatTitle').textContent = 'Conversation';
  document.getElementById('chatSubtitle').textContent = formatTime(convo.created_at);

  container.innerHTML = '';

  if(!messages || !Array.isArray(messages) || !messages.length){
    container.innerHTML = '<div class="convo-empty">No messages in this conversation</div>';
    return;
  }

  messages.forEach(message => {
    const bubble = document.createElement('div');
    const isUser = message.role === 'user';
    bubble.className = `bubble ${isUser ? 'user' : 'bot'}`;
    bubble.textContent = message.content || '';
    container.appendChild(bubble);
  });

  container.scrollTop = 0;
}

async function getClientId(user){
  const linked = await sb.from('ClientUsers').select('client_id').eq('auth_user_id', user.id).maybeSingle();
  if(linked.data?.client_id) return linked.data.client_id;
  const fallback = await sb.from('Clients').select('id').eq('contact_email', user.email).maybeSingle();
  return fallback.data?.id || null;
}

async function loadConversations(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = '/client-login.html'; return; }

  const clientId = await getClientId(session.user);
  if(!clientId){
    document.getElementById('conversationList').innerHTML =
      '<div class="empty-state">No client account found for this login.</div>';
    return;
  }

  const { data, error } = await sb.from('Conversations')
    .select('*').eq('client_id', String(clientId))
    .order('created_at', { ascending: false });

  if(error){
    document.getElementById('conversationList').innerHTML =
      `<div class="empty-state">${escapeHtml(error.message)}</div>`;
    return;
  }

  allConversations = data || [];

  // Stable numbering: oldest conversation is #1, regardless of sort or search
  [...allConversations]
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
    .forEach((c, i) => { c._num = i + 1; });

  renderConversationList(getVisibleConversations());
}

let sortOrder = 'newest';

function getVisibleConversations(){
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = allConversations;
  if(query){
    items = items.filter(conversation => {
      const text = JSON.stringify(conversation.messages || []).toLowerCase();
      return text.includes(query);
    });
  }
  items = [...items].sort((a, b) => {
    const ta = new Date(a.created_at).getTime() || 0;
    const tb = new Date(b.created_at).getTime() || 0;
    return sortOrder === 'newest' ? tb - ta : ta - tb;
  });
  return items;
}

document.getElementById('searchInput').addEventListener('input', () => {
  renderConversationList(getVisibleConversations());
});

document.getElementById('sortSelect').addEventListener('change', (event) => {
  sortOrder = event.target.value;
  renderConversationList(getVisibleConversations());
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = '/client-login.html';
});

loadConversations();
</script>
</body>
</html>
