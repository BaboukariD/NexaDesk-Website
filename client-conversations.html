<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaDesk — Conversations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

body {
  background: #050816;
  color: white;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

/* ── SIDEBAR ── */

.sidebar {
  width: 360px;
  background: #070b18;
  border-right: 1px solid rgba(255,255,255,.05);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-header img {
  width: 140px;
  object-fit: contain;
}

.back-link {
  color: #8b5cf6;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.search-wrap {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.search {
  width: 100%;
  padding: 12px 16px;
  background: #0d1117;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px;
  color: white;
  font-size: 14px;
  outline: none;
}

.search::placeholder { color: #4b5563; }
.search:focus { border-color: #8b5cf6; }

.convo-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.convo-item {
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .18s;
  background: #0d1117;
}

.convo-item:hover {
  border-color: rgba(139,92,246,.3);
  transform: translateY(-1px);
}

.convo-item.active {
  border-color: #8b5cf6;
  background: #130d2a;
}

.convo-num {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
  color: white;
}

.convo-preview {
  font-size: 12px;
  color: #6b7280;
  line-height: 1.5;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.convo-time {
  font-size: 11px;
  color: #374151;
  margin-top: 8px;
}

.empty-list {
  padding: 30px 16px;
  color: #4b5563;
  font-size: 14px;
  text-align: center;
}

/* ── CHAT AREA ── */

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #050816;
}

.chat-header {
  padding: 22px 28px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.chat-title {
  font-size: 20px;
  font-weight: 700;
}

.chat-sub {
  font-size: 13px;
  color: #6b7280;
  margin-top: 4px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.bubble {
  max-width: 72%;
  padding: 14px 18px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.bubble.user {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.bubble.bot {
  background: #0d1117;
  border: 1px solid rgba(255,255,255,.06);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.empty-chat {
  margin: auto;
  color: #374151;
  font-size: 15px;
  text-align: center;
}

.empty-chat span {
  font-size: 36px;
  display: block;
  margin-bottom: 12px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 20px; }

@media (max-width: 900px) {
  .sidebar { width: 100%; height: 300px; border-right: none; border-bottom: 1px solid rgba(255,255,255,.05); }
  .app { flex-direction: column; }
  .chat-area { height: calc(100vh - 300px); }
  .bubble { max-width: 88%; }
}

</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="sidebar-header">
      <img src="./nexadesk-logo.png" alt="NexaDesk" />
      <a href="/client-dashboard.html" class="back-link">← Dashboard</a>
    </div>

    <div class="search-wrap">
      <input type="text" class="search" id="searchInput" placeholder="Search conversations..." />
    </div>

    <div class="convo-list" id="convoList">
      <div class="empty-list">Loading...</div>
    </div>

  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">

    <div class="chat-header">
      <div class="chat-title" id="chatTitle">Conversations</div>
      <div class="chat-sub" id="chatSub">Select a conversation to view</div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-chat">
        <span>💬</span>
        Select a conversation from the left
      </div>
    </div>

  </div>

</div>

<script>
const SUPABASE_URL = 'https://exqdmvloldvshzpxevht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cWRtdmxvbGR2c2h6cHhldmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzc5NDQsImV4cCI6MjA5NjYxMzk0NH0.nI_pnnKo236Bd6whjvfvZMGnStJz8q4y6ttENmiNgxg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allConvos = [];

function formatTime(str) {
  return new Date(str).toLocaleString('en-GB', {
    day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}

function getPreview(messages) {
  if (!Array.isArray(messages) || !messages.length) return 'No messages';
  const first = messages.find(m => m.role === 'user');
  return first?.content || messages[0]?.content || 'Empty conversation';
}

function renderList(items) {
  const list = document.getElementById('convoList');
  list.innerHTML = '';

  if (!items.length) {
    list.innerHTML = '<div class="empty-list">No conversations found</div>';
    return;
  }

  items.forEach((convo, i) => {
    const item = document.createElement('div');
    item.className = 'convo-item';
    item.innerHTML = `
      <div class="convo-num">Conversation ${items.length - i}</div>
      <div class="convo-preview">${getPreview(convo.messages)}</div>
      <div class="convo-time">${formatTime(convo.created_at)}</div>
    `;
    item.addEventListener('click', () => {
      document.querySelectorAll('.convo-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      renderMessages(convo);
    });
    list.appendChild(item);
  });
}

function renderMessages(convo) {
  const container = document.getElementById('messages');
  const title     = document.getElementById('chatTitle');
  const sub       = document.getElementById('chatSub');

  title.textContent = `Conversation — ${formatTime(convo.created_at)}`;
  sub.textContent   = `${convo.messages?.length || 0} messages`;

  container.innerHTML = '';

  if (!Array.isArray(convo.messages) || !convo.messages.length) {
    container.innerHTML = '<div class="empty-chat"><span>💬</span>No messages in this conversation</div>';
    return;
  }

  convo.messages.forEach(msg => {
    const bubble = document.createElement('div');
    bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'bot'}`;
    bubble.textContent = msg.content || '';
    container.appendChild(bubble);
  });

  container.scrollTop = container.scrollHeight;
}

async function init() {
  // Auth check
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/client-login.html'; return; }

  // Get client_id
  const { data: clientUser } = await sb
    .from('ClientUsers')
    .select('client_id')
    .eq('auth_user_id', session.user.id)
    .maybeSingle();

  if (!clientUser) {
    document.getElementById('convoList').innerHTML = '<div class="empty-list">Client not found. Please contact support.</div>';
    return;
  }

  // Load conversations filtered by client_id
  const { data, error } = await sb
    .from('Conversations')
    .select('*')
    .eq('client_id', String(clientUser.client_id))
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('convoList').innerHTML = '<div class="empty-list">Error loading conversations.</div>';
    return;
  }

  allConvos = data || [];
  renderList(allConvos);
}

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = allConvos.filter(c =>
    JSON.stringify(c.messages || []).toLowerCase().includes(q)
  );
  renderList(filtered);
});

init();
</script>

</body>
</html>
